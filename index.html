<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paquetes · Cancun100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="/paquetes.js"></script>
<style>
:root{--magenta:#0E7C8C;--tinta:#10333A;--gris:#5A6E72;--linea:#D9E4E2;--arena:#EFE7D9;--arenaclara:#FAF3E7;--amarillo:#FFC24B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Karla',sans-serif;background:var(--arena);color:var(--tinta);line-height:1.55}
.revista{max-width:1000px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 40px rgba(4,60,70,.16)}
.cab{background:var(--magenta);color:#fff;padding:44px 40px 40px}
.cab img{width:220px;height:auto;display:block;margin-bottom:26px;filter:drop-shadow(0 2px 14px rgba(2,40,52,.22))}
.cab h1{font-family:'Questrial',sans-serif;font-size:clamp(30px,5vw,50px);line-height:1.02;letter-spacing:-.02em;max-width:18ch}
.cab p{margin-top:14px;font-size:16px;opacity:.9;max-width:52ch}
.tabs{background:var(--arenaclara);border-bottom:1px solid #E4D9C6;padding:0 40px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{text-decoration:none;color:#3F6E69;font-size:14px;padding:14px 14px;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--magenta)}
.tabs a small{opacity:.65;margin-right:6px}
.grid{padding:36px 40px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{display:block;text-decoration:none;color:inherit;border:1px solid var(--linea);border-top:6px solid var(--magenta);
  padding:22px 22px 20px;background:#fff;transition:transform .16s ease,box-shadow .16s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(4,60,70,.14)}
.card:focus-visible{outline:3px solid var(--amarillo);outline-offset:3px}
.card .n{font-family:'Questrial',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
.card .t{font-family:'Questrial',sans-serif;font-size:23px;line-height:1.1;margin:8px 0 10px;color:var(--tinta)}
.card .s{font-size:14px;color:var(--gris)}
.card .b{display:inline-block;margin-top:18px;background:var(--magenta);color:#fff;font-family:'Questrial',sans-serif;
  font-size:14px;padding:9px 18px;border-radius:30px}
.pie{padding:18px 40px 30px;font-size:13px;color:var(--gris);border-top:1px solid var(--linea)}
@media(max-width:780px){.cab,.tabs,.grid,.pie{padding-left:22px;padding-right:22px}}
</style>
</head>
<body>
<div class="revista">
  <header class="cab">
    <img src="/xcaret/img/02-4a35fba7.png" alt="Cancun100">
    <h1>Paquetes armados, listos para vender</h1>
    <p>Cada paquete es una revista con su itinerario día por día, fichas de cada tour y las notas para el asesor. Elige uno para abrirlo.</p>
  </header>
  <nav class="tabs" id="tabs" aria-label="Paquetes"></nav>
  <main class="grid" id="grid"></main>
  <footer class="pie">Cancun100 · Los paquetes son personalizables: se pueden cambiar tours, mover días o agregar actividades.</footer>
</div>
<script>
(function(){
  var ps = window.PAQUETES || [];
  document.getElementById("tabs").innerHTML = ps.map(function(p){
    return '<a href="/'+p.slug+'/"><small>'+p.num+'</small>'+p.corto+'</a>';
  }).join("");
  document.getElementById("grid").innerHTML = ps.map(function(p){
    return '<a class="card" href="/'+p.slug+'/" style="border-top-color:'+(p.color||"#0E7C8C")+'">' +
      '<div class="n">Paquete '+p.num+'</div><div class="t">'+p.titulo+'</div><div class="s">'+p.sub+'</div>' +
      '<span class="b">Ver el paquete</span></a>';
  }).join("");
})();
</script>
</body>
</html>
